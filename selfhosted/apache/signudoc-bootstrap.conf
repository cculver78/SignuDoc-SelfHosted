# Temporary HTTP-only vhost used to obtain the first Let's Encrypt certificate.
# Replace the example hostname before installing this file.
<VirtualHost *:80>
    ServerName signudoc.example.com
    DocumentRoot /var/lib/letsencrypt

    <Directory /var/lib/letsencrypt/>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    Alias /.well-known/acme-challenge/ /var/lib/letsencrypt/.well-known/acme-challenge/
    <Directory /var/lib/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/signudoc-bootstrap-error.log
    CustomLog ${APACHE_LOG_DIR}/signudoc-bootstrap-access.log combined
</VirtualHost>
