# Replace signudoc.example.com in both ServerName and the HTTP_HOST guard.
# Apache is assumed to be the Internet-facing reverse proxy for this hostname.

<VirtualHost *:80>
    ServerName signudoc.example.com
    DocumentRoot /var/lib/letsencrypt

    <Directory /var/lib/letsencrypt/>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    Alias /.well-known/acme-challenge/ /var/lib/letsencrypt/.well-known/acme-challenge/
    <Directory /var/lib/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://signudoc.example.com%{REQUEST_URI} [R=301,END,NE]

    ErrorLog ${APACHE_LOG_DIR}/signudoc-error.log
    CustomLog ${APACHE_LOG_DIR}/signudoc-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName signudoc.example.com
    UseCanonicalName On

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/signudoc.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/signudoc.example.com/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    ProxyTimeout 300

    # The application uses the first X-Forwarded-For value as the client IP.
    # Strip visitor supplied forwarding and CDN headers before mod_proxy adds
    # the TCP peer address it observed. Set the scheme from this TLS vhost.
    RequestHeader unset Forwarded early
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader unset X-Forwarded-Proto early
    RequestHeader unset X-Forwarded-Port early
    RequestHeader unset X-Forwarded-Server early
    RequestHeader unset X-Forwarded-Ssl early
    RequestHeader unset X-Real-IP early
    RequestHeader unset CF-Connecting-IP early
    RequestHeader unset True-Client-IP early
    RequestHeader unset X-Client-IP early
    RequestHeader unset X-Original-Forwarded-For early
    RequestHeader unset X-Vercel-Forwarded-For early
    RequestHeader set X-Forwarded-Proto "https" early

    # Reject other Host values before preserving the host to the application.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^signudoc\.example\.com(?::443)?$ [NC]
    RewriteRule ^ - [R=400,L]

    # Leave multipart overhead above SignuDoc's 20 MiB PDF limit; the app
    # remains responsible for validating the actual uploaded file.
    LimitRequestBody 23068672

    ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=300
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/signudoc-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/signudoc-ssl-access.log combined
</VirtualHost>
